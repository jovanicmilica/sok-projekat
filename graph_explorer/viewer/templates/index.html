<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=restore-tree-workspace-1" />
    <link rel="stylesheet" href="{% static 'css/tree_view.css' %}?v=restore-tree-workspace-1" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <div class="app-container">
      <div class="header">
        <div class="view-chooser">
          <span class="title">Graph Visualizer</span>
          <ul class="plugin-chooser">
            <select name="visualizer-plugin" id="visualizer-plugin-select" onchange="handleVisualizerPluginSelection()">
              <option value="none">Select visualizer plugin...</option>
            </select>
          </ul>
          <ul class="plugin-chooser">
            <select name="plugin" id="plugin-select" onchange="handleDataSourcePluginSelection()">
              <option value="none">Select datasource plugin...</option>
            </select>
          </ul>
        </div>

        <div class="workspace-container">
          <div class="workspace-header">
            <span class="workspace-label">Workspaces:</span>
            <div class="workspace-actions">
              <button class="workspace-btn new-workspace-btn" onclick="createNewWorkspace()">
                New workspace
              </button>
              <button class="workspace-btn save-workspace-btn" onclick="saveWorkspace()">
                Save workspace state
              </button>
            </div>
          </div>
          <div class="workspace-list" id="workspace-list">
            <!-- Workspace bubbles will be added dynamically -->
          </div>
        </div>

        <div class="filters-container">
          <div class="file-input-container">
            <!-- File input will be added here dynamically -->
          </div>

          <div class="search-input-container">
            <input
              type="text"
              id="word-search-input"
              placeholder="Search..."
            />
            <button class="text-btn" onclick="addSearch()">Search</button>
          </div>

          <div class="filter-container">
            <input
              type="text"
              id="attribute-name-input"
              placeholder="Enter attribute name..."
            />
            <select id="relation-input" name="relation-input">
              <option value="==">==</option>
              <option value=">=">>=</option>
              <option value=">">></option>
              <option value="<"><</option>
              <option value="<="><=</option>
              <option value="!=">!=</option>
            </select>
            <input
              type="text"
              id="attribute-value-input"
              placeholder="Enter attribute value..."
            />
            <button class="text-btn" onclick="addFilter()">Apply</button>
          </div>

          <div class="applied-filters-container">
            <span>Applied filters</span>
            <button class="text-btn reset-filters-btn" type="button" onclick="resetGraphOperations()">Reset</button>
            <!-- Applied filters will be added here dynamically -->
          </div>
        </div>
      </div>

      <div class="views-container">
        <div class="left-column-views">
          <div class="tree-view-container"></div>
          <div class="bird-view-container"></div>
        </div>
        <div class="right-column-views">
          <div class="main-view-container"></div>
        </div>
      </div>

      <div class="cli-terminal-container">
        <div class="cli-terminal-header">
          <span>CLI Terminal</span>
        </div>
        <div class="cli-output" id="cli-output"></div>
        <div class="cli-input-row">
          <span class="cli-prompt">&gt;</span>
          <input id="cli-command-input" type="text" placeholder="create node --id=1 --property Name=Alice" autocomplete="off" />
          <button class="text-btn" id="cli-run-btn" type="button">Run</button>
        </div>
      </div>
    </div>

    <script src="{% static 'js/graph_observer.js' %}?v=restore-tree-workspace-1"></script>
    <script src="{% static 'js/tree_view.js' %}?v=restore-tree-workspace-1"></script>
    <script src="{% static 'js/index_filters.js' %}?v=restore-tree-workspace-1"></script>
    <script src="{% static 'js/index_plugins.js' %}?v=restore-tree-workspace-1"></script>
    <script src="{% static 'js/index_workspace.js' %}?v=restore-tree-workspace-1"></script>
    <script src="{% static 'js/index_cli.js' %}?v=restore-tree-workspace-1"></script>
  </body>
</html>
